schema_version: 1

context:
  name: facebook_business
  version: "26.0.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/facebook_business-${{ version }}.tar.gz
  sha256: e5e6980f1bf70473dead9d37eb0408f1d677876f44d509d22671d39395f9f63f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests >=2.3.0
    - six >=1.7.3
    - curlify >=2.1.0
    - pycountry >=19.8.18
    - capi-param-builder-python >=1.3.0
    - aiohttp
tests:
  - python:
      imports:
        - facebook_business
        - facebook_business.adobjects
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Facebook Business SDK
  license: LicenseRef-Facebook-Platform
  license_file: LICENSE
  homepage: https://github.com/facebook/facebook-python-business-sdk
  repository: https://github.com/facebook/facebook-python-business-sdk
  documentation: https://developers.facebook.com/docs/business-sdk

extra:
  recipe-maintainers:
    - kcemenike
    - xylar
