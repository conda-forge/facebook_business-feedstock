schema_version: 1

context:
  name: facebook_business
  version: "26.0.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/facebook_business-${{ version }}.tar.gz
  sha256: c9c3787a7ab048c8f0b4b6609204e49b877e0d3e67401f0bec20170821694df5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests >=2.3.0
    - six >=1.7.3
    - curlify >=2.1.0
    - pycountry >=19.8.18
    - capi-param-builder-python >=1.3.0
    - aiohttp
tests:
  - python:
      imports:
        - facebook_business
        - facebook_business.adobjects
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Facebook Business SDK
  license: LicenseRef-Facebook-Platform
  license_file: LICENSE
  homepage: https://github.com/facebook/facebook-python-business-sdk
  repository: https://github.com/facebook/facebook-python-business-sdk
  documentation: https://developers.facebook.com/docs/business-sdk

extra:
  recipe-maintainers:
    - kcemenike
    - xylar
